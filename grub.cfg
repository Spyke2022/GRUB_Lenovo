# This file provides an easy way to add custom menu entries.

menuentry 'Garuda Linux (Sway)' --class garuda --class gnu-linux --class gnu --class os {
    insmod part_gpt
    insmod btrfs
    search --no-floppy --fs-uuid --set=root 8bd3f167-6c5c-4577-ab47-9965d1964e7f
    echo 'Carregando Garuda Sway...'
    linux /@/boot/vmlinuz-linux-zen root=UUID=8bd3f167-6c5c-4577-ab47-9965d1964e7f rw rootflags=subvol=@ loglevel=3 quiet nowatchdog
    initrd /@/boot/initramfs-linux-zen.img
}
### END /etc/grub.d/40_custom ###

### BEGIN /etc/grub.d/41_custom ###
if [ -f  ${config_directory}/custom.cfg ]; then
  source ${config_directory}/custom.cfg
elif [ -z "${config_directory}" -a -f  $prefix/custom.cfg ]; then
  source $prefix/custom.cfg
fi
### END /etc/grub.d/41_custom ###

### BEGIN /etc/grub.d/41_snapshots-btrfs ###
if [ ! -e "${prefix}/grub-btrfs.cfg" ]; then
echo ""
else
submenu 'Garuda Linux snapshots' {
    configfile "${prefix}/grub-btrfs.cfg"
}
fi
### END /etc/grub.d/41_snapshots-btrfs ###

